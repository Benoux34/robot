[project]
name = "robot"
version = "0.1.0"
description = "Agent d'audit et de correction de code dans un sandbox Docker"
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7.1",
    "docker>=7.2.0",
    "packaging>=26.3",
    "typer>=0.27.2",
]

[project.scripts]
robot = "robot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
